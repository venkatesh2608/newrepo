name: Selenium Maven Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Sets the terminal context directory for custom bash execution steps
defaults:
  run:
    working-directory: newrepo/demo

jobs:
  regression-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull the codebase into the virtual workspace
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Configure Java and override default search behavior for pom.xml
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          # CRITICAL FIX: Directs the caching tool directly to your sub-folder's pom.xml
          cache-dependency-path: 'newrepo/demo/pom.xml'

      # 3. Verify local pre-installed Google Chrome version
      - name: Check Chrome Browser Version
        run: google-chrome --version

      # 4. Trigger test execution natively inside newrepo/demo/
      - name: Run Selenium Tests
        run: mvn clean test

      # 5. Extract and preserve the output reports even if tests fail
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports
          path: |
            newrepo/demo/target/surefire-reports/
            newrepo/demo/target/site/
          retention-days: 7
