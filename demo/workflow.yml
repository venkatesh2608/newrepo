name: Selenium Maven Test Suite

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Optional: Automatically runs every night at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual execution from the GitHub interface

jobs:
  regression-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull the code from your repository
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Set up the Java Development Kit (JDK)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' # Automatically caches dependencies for faster future runs

      # 3. Verify Google Chrome is available on the runner
      - name: Check Chrome Browser Version
        run: google-chrome --version

      # 4. Execute your test suite using the Maven surefire plugin
      - name: Run Selenium Tests
        run: mvn clean test

      # 5. Archive and save test results if any tests fail
      - name: Upload Test Reports
        if: always() # Ensures reports upload even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports
          path: |
            **/target/surefire-reports/
            **/target/site/
          retention-days: 7